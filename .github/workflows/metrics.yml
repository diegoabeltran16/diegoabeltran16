name: GitHub Metrics

on:
  schedule: 
    - cron: "0 10 * * *"  # Runs daily at 10:00 UTC = 5 AM Bogotá
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Generate and commit SVG metrics
      - name: Generate metrics in SVG
        uses:  lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          output_action: commit
          committer_branch: generated
          
          base: header
          
          plugin_languages: yes
          plugin_languages_limit: 100
          
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: icons
          plugin_topics_sort: stars

      # Generate and commit PNG metrics (transparent)
      - name: Generate metrics in PNG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.png
          config_output: png
          output_action: commit
          committer_branch: generated
          
          base: header
          
          plugin_languages: yes
          plugin_languages_limit: 100
          
          plugin_topics:  yes
          plugin_topics_limit: 15
          plugin_topics_mode: icons
          plugin_topics_sort: stars
